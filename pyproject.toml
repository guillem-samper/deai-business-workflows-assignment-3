[project]
name = "guillem-base-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guillem-samper", email = "gsamper2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.4.0",
    "discord-webhook>=1.4.1",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "openai>=3.46.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.uv.build-backend]
module-name = "paper_pipeline"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
